name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any code change -- new CVEs get published
    # against dependencies that haven't themselves changed.
    - cron: "0 6 * * 1"

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync environment
        run: uv sync --python 3.11 --extra dev

      # Run inside the project's own synced environment (`uv run --with`),
      # not an isolated `uvx` env, so the scan sees the actual dependency
      # set this project ships -- not scanning tools themselves aren't
      # added as project dependencies. No vulnerability is ignored: if one
      # can't be fixed by upgrading, document why here before adding
      # `--ignore-vuln`.
      - name: Dependency vulnerability scan (pip-audit)
        run: uv run --with pip-audit pip-audit

      - name: Static security scan (Bandit)
        run: uv run --with bandit bandit -r src scripts app -ll
