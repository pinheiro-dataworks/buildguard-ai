# Base configuration for BuildGuard AI.
# Every threshold and magic number referenced by src/buildguard should
# resolve back to a documented value here (or in business.yaml / training.yaml
# / monitoring.yaml) rather than being hard-coded — see Section 27/37 of
# BUILDGUARD_AI_PROJECT_SCOPE.md.

seed: 42

paths:
  data_sample: "data/sample"
  # Full generated dataset -- gitignored (data/processed/), regenerated on
  # demand by `make data`. data_sample/ is the small, committed subset.
  data_processed: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  # SQLite, not the raw filesystem store ("file:./mlruns") -- MLflow's
  # filesystem backend is now in maintenance mode (raises unless
  # MLFLOW_ALLOW_FILE_STORE=true is set; discovered while wiring this up).
  # SQLite is still a single local file, zero-cost, no server -- just the
  # backend MLflow itself now recommends. See docs/adr/0006-model-selection.md.
  mlflow_tracking_uri: "sqlite:///mlruns/mlflow.db"

targets:
  # cost_overrun = final_cost > approved_budget * (1 + cost_overrun_tolerance)
  # Primary tolerance used for the headline classification target. Configurable
  # to 0 / 5 / 10% per Section 6.1 — 10% chosen as the primary default because
  # it matches a common construction-industry contingency-band convention
  # (small variances are normal project noise, not "overrun" events worth
  # flagging to management). Rationale recorded in docs/adr/0006-model-selection.md.
  cost_overrun_tolerance: 0.10

  # schedule_delay = actual_completion_date > planned_completion_date + tolerance_days
  schedule_delay_tolerance_days: 14

synthetic_data:
  # Target scale per Section 8.2 (range 100-500 projects). 400 gives, at an
  # average project duration of ~30 months (see monthly_observations_*),
  # roughly 400*30 = 12,000 snapshot rows -- comfortably inside the
  # 10,000-100,000 snapshot target even after accounting for
  # shorter-duration projects, while staying inside Streamlit Community
  # Cloud free-tier memory/CPU limits.
  n_projects: 400
  work_packages_per_project_min: 20
  work_packages_per_project_max: 80
  # Distinct supplier pool the portfolio draws from (Section 8.2: 100-1,000
  # suppliers). A pool smaller than the project count creates realistic
  # supplier concentration -- some suppliers serve many projects.
  suppliers_pool_size: 400
  suppliers_per_project_min: 3
  suppliers_per_project_max: 12
  monthly_observations_min: 12
  monthly_observations_max: 48
  # "Today" in the synthetic universe: fixed, never datetime.now(), so
  # `make data` is byte-identical across runs and machines (Section 26).
  reference_date: "2026-01-01"
  # How far back planned_start_date can be sampled from reference_date --
  # gives a realistic mix of completed and in-flight projects.
  history_years: 5
  # A project must start at least this many months before reference_date,
  # so every generated project has at least one snapshot.
  min_start_lead_months: 1
  # Fraction of projects still in-flight (not yet actually completed) as of
  # reference_date -- enough to demo "live" prediction on ongoing projects
  # later (Project Diagnostic / Scenario Simulator), while the rest are
  # resolved and carry ground-truth labels for training.
  in_flight_fraction: 0.12

split:
  # Chronological split, oldest-first. See docs/adr/0003-temporal-validation.md.
  train_fraction: 0.60
  calibration_fraction: 0.20
  test_fraction: 0.20

features:
  # Lifecycle position (elapsed / planned duration) boundaries used to
  # bucket a snapshot into early/mid/late stage (Section 18 slice
  # analysis dimension). Thirds, the simplest defensible default absent
  # domain-specific phase-gate data.
  lifecycle_early_threshold: 0.33
  lifecycle_late_threshold: 0.66
  # Trailing window (months) used for CPI/SPI trend features -- captures
  # "persistent deterioration" (Section 8.2) without being so short that
  # single-month noise dominates, or so long that it washes out real
  # recent shifts.
  trend_window_months: 3

training:
  # Optuna trials per (task, model family) -- Section 15: "avoid
  # unjustified exhaustive grids." 15 is a modest budget (not a grid) that
  # converges well in practice for a 3-4 hyperparameter space at this
  # dataset size, while keeping `make train`'s runtime reasonable (3
  # tasks x 2 families x 15 trials x 3 folds = 270 fits, not 600+).
  optuna_n_trials: 15
  # GroupKFold splits (grouped by project_id) used to score each trial.
  cv_splits: 3
  mlflow_experiment_name: "buildguard-ai"

uncertainty:
  # Target coverage for the final-cost split-conformal interval (Section
  # 19's own worked example reports an 80% interval).
  target_coverage: 0.80

baselines:
  # Domain-rule classification baseline (Section 13's own example):
  # "CPI < 0.90 -> High Cost Risk." 0.90 is a common informal
  # project-controls rule of thumb (>10% adverse cost variance is worth
  # flagging), kept distinct from targets.cost_overrun_tolerance, which
  # governs the *label* (final outcome), not this real-time heuristic.
  cpi_risk_threshold: 0.90
