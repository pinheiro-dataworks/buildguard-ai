[project]
name = "buildguard-ai"
version = "0.1.0"
description = "Production-oriented ML platform for construction cost-overrun and schedule-delay risk, built on Earned Value Management analytics — leakage-safe features, calibrated probabilities, uncertainty, and explainability, deployed at zero recurring cost."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Renan (renan-ds)" }]
keywords = [
  "machine-learning",
  "data-science",
  "mlops",
  "construction",
  "proptech",
  "cost-control",
  "earned-value-management",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies — kept minimal per development phase.
# Additional phases add their own dependencies deliberately (see optional
# groups below) rather than front-loading the full stack before it is used.
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pandera[pandas]>=0.20",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Phase 4-5: advanced modeling, calibration, uncertainty.
ml = [
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "optuna>=3.6",
  "shap>=0.46",
  "mlflow>=2.16",
]
# Phase 8: FastAPI inference service.
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.31",
]
# Phase 8: Streamlit public application.
app = [
  "streamlit>=1.38",
  "plotly>=5.24",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-pyyaml>=6.0",
  "types-python-dateutil>=2.9",
  "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # flake8-bugbear
  "C4",            # flake8-comprehensions
  "SIM",           # flake8-simplify
  "N",             # pep8-naming
  "RUF",           # ruff-specific
]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["buildguard"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pandera.*", "shap.*", "lightgbm.*", "optuna.*", "mlflow.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: fast, isolated unit tests",
  "integration: multi-component pipeline tests",
  "leakage: temporal anti-leakage guarantees",
  "contracts: data contract / schema validation tests",
  "monitoring: drift and data-quality monitoring tests",
  "api: FastAPI contract tests",
]

[tool.coverage.run]
source = ["src/buildguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
